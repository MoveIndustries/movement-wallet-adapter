name: Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install global dependencies
        run: pnpm install --frozen-lockfile

      - name: Test wallet adapters
        run: pnpm run test --filter=@moveindustries/wallet-adapter-keyless --filter=@moveindustries/wallet-adapter-passkey --filter=@moveindustries/wallet-adapter-deeplink

      - name: Build global project
        env:
          GAID: ${{ vars.APTOS_WALLET_ADAPTER_GAID }}
        run: pnpm run build --filter=!nuxt-app
